name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test
      - name: Benchmark (release build, informational)
        if: runner.os == 'Linux'
        run: cargo run --release -- --bench
